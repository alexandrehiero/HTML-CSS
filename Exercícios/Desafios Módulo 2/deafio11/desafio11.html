<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 11</title>
    <link rel="shortcut icon" href="../../Ex.004/favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        #container {
            position: relative;
            height: 100vh;
            background-image: url(imagens/espaco.jpg);

            background-attachment: fixed;
        }
    
        #astronauta {
            position: absolute;
            background-image: url(imagens/astronauta.png);

            height: 500px;
            width: 500px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
        }

    </style>

</head>
<body>
    <div id="container">
        <div id="astronauta">

        </div>
    </div>
</body>
