<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Em que ano você nasceu?</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inum1">
                Ano de Nascimento: 
            </label>
            <input type="number" name="ano" id="iano" min="1900" max="2020" required
            oninput="calcIdade()">
        </p>

        <p>
            <label for="iidade">Sua idade: </label>
            <output name="idade" id="iidade">0</output>
        </p>
        
        <p>
            <input type="submit" value="Envia">
            <input type="reset" value="Limpar">
        </p>
    </form>
    

    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
