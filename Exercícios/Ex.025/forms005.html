<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Teste de Formulários</h1>

    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isexomas" value="M"> <label for="isexomas">Masculino</label>

            <input type="radio" name="sexo" id="isexofem" value="F"> <label for="isexofem">Feminimo</label>
        </fieldset>
        
        
        <fieldset>
            <legend>Esporte Favorito</legend>
    
            <input type="checkbox" name="bas" id="ibas" checked> <label for="ibas">Basquete</label>
            
            <input type="checkbox" name="fut" id="ifut"> <label for="ifut">Futebol</label>
            
            <input type="checkbox" name="golf" id="igolf"> <label for="igolf">Golfe</label>
            
            <input type="checkbox" name="nat" id="inat"> <label for="inat">Natação</label>
            
            <input type="checkbox" name="ten" id="iten"> <label for="iten">Tênis</label> 
            
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

</body>
</html>
